<!doctype html>
<html lang="id">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
 <meta name="theme-color" content="#4f46e5" />
 <title>Offline · BahasaKita</title>
 <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
 <style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #1e1b4b; background: #f5f3ff; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; min-height: 100dvh; margin: 0; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); display: grid; place-items: center; }
  main { width: min(100%, 480px); padding: 36px 30px; border: 1px solid #ddd6fe; border-radius: 24px; background: #fff; }
  img { display: block; width: 88px; height: 88px; border-radius: 20px; margin-bottom: 24px; }
  .label { color: #5b21b6; font-weight: 650; font-size: .88rem; }
  h1 { font-size: clamp(1.7rem, 6vw, 2.1rem); letter-spacing: -.035em; line-height: 1.2; margin: 12px 0 18px; }
  p { color: #475569; line-height: 1.7; margin: 12px 0; }
  .note { padding: 14px 16px; background: #f5f3ff; border-radius: 14px; font-size: .9rem; margin: 22px 0; }
  a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 12px; background: #4f46e5; color: #fff; font-weight: 650; text-decoration: none; text-align: center; }
  a:hover { background: #4338ca; }
  a:focus-visible { outline: 3px solid #7c3aed; outline-offset: 5px; }
  @media (max-width: 360px) { main { padding: 28px 22px; } a { width: 100%; } }
  @media (prefers-color-scheme: dark) {
   :root { background: #0f172a; color: #f1f5f9; }
   main { background: #1e293b; border-color: #475569; }
   p { color: #cbd5e1; } .label { color: #c4b5fd; } .note { background: #312e81; color: #ede9fe; }
   a:focus-visible { outline-color: #c4b5fd; }
  }
 </style>
</head>
<body>
 <main>
  <img src="/icons/app-192.png" alt="Logo BahasaKita" width="88" height="88" />
  <span class="label">BahasaKita Learn</span>
  <h1>Koneksi terputus? Kita jeda dulu.</h1>
  <p>Aplikasi belum dapat terhubung. Periksa Wi-Fi atau data seluler, lalu buka kembali BahasaKita.</p>
  <p class="note">Asesmen, video, chat, dan penyimpanan progres memerlukan internet. Perubahan yang belum berhasil dikirim belum tersimpan.</p>
  <a href="/">Coba buka BahasaKita</a>
 </main>
</body>
</html>
